      <h1>大转型</h1>
      <p><strong>作者：</strong>卡尔·波兰尼（Karl Polanyi）</p>
      <p>论证市场社会并非自然产物，而是19世纪以来人为建构的结果。当劳动、土地、货币被当作可以自由买卖的&quot;虚拟商品&quot;，市场的自我调节逻辑会撕裂社会；而社会必然以&quot;反向运动&quot;（保护性立法、工会、福利国家）进行抵抗。双向运动构成现代政治经济史的骨架。</p>
